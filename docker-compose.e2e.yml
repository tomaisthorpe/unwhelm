services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: unwhelm_e2e
      POSTGRES_PASSWORD: unwhelm_e2e
      POSTGRES_DB: unwhelm_e2e
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unwhelm_e2e -d unwhelm_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
